# Follow the user's model choice in ~/.codex/config.toml or the Desktop picker.
# Workflow and escalation rules live in docs/agent/codex-workflow.md.

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Normally one owner; leave room for a justified independent investigation.
max_concurrent_threads_per_session = 2
