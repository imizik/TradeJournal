[project]
name = "trade-journal-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    # 0.0.46 rejects the app's established naive-UTC model values at bind time.
    # Keep deployment resolution on the last verified compatible release until
    # the timestamp model and stored data are migrated together.
    "sqlmodel==0.0.42",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "google-api-python-client>=2.170.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "tzdata>=2025.2",
    "yfinance>=0.2.36",
    "anthropic>=0.39.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # Static import graph for tests/test_import_boundaries.py.
    "grimp>=3.0",
    # Pinned exactly: a lint result is only reproducible if every machine and
    # CI resolve the same rule set. Bump deliberately, in its own commit.
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
# Scope collection to tests/. Without this pytest walks scripts/, where some
# ad hoc analysis utilities do real work (open databases, hit APIs) at import
# time and abort the whole run during collection.
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
extend-exclude = [
    # protoc output: regenerated, never edited, and it fails F821 by design.
    "app/engine/webull_proto",
]

[tool.ruff.lint]
# pyflakes (F: unused and undefined names, redefinitions) and pycodestyle
# errors (E: import placement, comparisons, ambiguous names). Every rule here
# points at a mistake. Style families (I, B, UP, the formatter) are not
# selected: they would touch most files without finding a defect.
select = ["E", "F"]
# No line-length limit: the code was not written to one, and reflowing it
# would be churn without a defect.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py installs a warnings filter before the rest of its imports, on
# purpose, so imports there are not all at the top.
"app/main.py" = ["E402"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
