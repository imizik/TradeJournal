name: Supervised overnight fixture trial

# Branch-only operational rehearsal. Never merge this trigger into main.
# No cron, manual dispatch registration, secrets, or application deployment.
on:
  push:
    branches: [codex/supervised-overnight-trial]
    paths: [.github/workflows/overnight-trial-once.yml]

permissions:
  contents: read

concurrency:
  group: supervised-overnight-fixture
  cancel-in-progress: false

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare runtime (package downloads only)
        run: |
          mkdir -m 700 "$RUNNER_TEMP/overnight-build"
          cat > "$RUNNER_TEMP/overnight-build/Dockerfile" <<'DOCKER'
          FROM python:3.12-slim
          RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
          RUN pip install --no-cache-dir numpy==2.5.4
          DOCKER
          docker build -t tj-overnight-fixture "$RUNNER_TEMP/overnight-build"
          mkdir -m 700 "$RUNNER_TEMP/overnight-evidence"
          cp "$RUNNER_TEMP/overnight-build/Dockerfile" "$RUNNER_TEMP/overnight-evidence/Dockerfile"
          docker image inspect tj-overnight-fixture --format '{{.Id}}' > "$RUNNER_TEMP/overnight-evidence/image-id.txt"
          mkdir "$RUNNER_TEMP/overnight-scratch"
          sudo mount -t tmpfs -o size=1G,mode=1777,nosuid,nodev,noexec tmpfs "$RUNNER_TEMP/overnight-scratch"
      - name: Run offline fixture and process-recovery proof
        id: trial
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cleanup() {
            for name in tj-overnight-fixture-run tj-overnight-retention-probe; do
              if docker container inspect "$name" >/dev/null 2>&1; then
                docker logs "$name" > "$RUNNER_TEMP/overnight-evidence/$name.log" 2>&1 || true
                docker inspect "$name" --format '{{json .State}}' > "$RUNNER_TEMP/overnight-evidence/$name-state.json"
                docker rm -f "$name" >/dev/null
              fi
            done
          }
          trap cleanup EXIT
          limits=(--init --network none --read-only --cap-drop ALL --security-opt no-new-privileges
            --cpus 1 --memory 1g --memory-swap 1g --pids-limit 128
            --user "$(id -u):$(id -g)" --workdir /repo
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly"
            --mount "type=bind,source=$RUNNER_TEMP/overnight-evidence,target=/out"
            --mount "type=bind,source=$RUNNER_TEMP/overnight-scratch,target=/tmp"
            --env HOME=/tmp --env PYTHONDONTWRITEBYTECODE=1 --env OPENBLAS_NUM_THREADS=1
            --env OMP_NUM_THREADS=1 --env MKL_NUM_THREADS=1)
          timeout --signal=TERM --kill-after=10s 600s docker run --name tj-overnight-fixture-run "${limits[@]}" \
            tj-overnight-fixture python scripts/overnight_supervised_once.py --output /out --require-isolation
          cleanup
          docker run -d --name tj-overnight-retention-probe "${limits[@]}" \
            tj-overnight-fixture python scripts/overnight_supervised_once.py --retention-probe
          for attempt in $(seq 1 100); do
            [ ! -f "$RUNNER_TEMP/overnight-scratch/termination-probe/ready.json" ] || break
            sleep 0.2
          done
          test -f "$RUNNER_TEMP/overnight-scratch/termination-probe/ready.json"
          docker kill --signal KILL tj-overnight-retention-probe
          test "$(docker wait tj-overnight-retention-probe)" = 137
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          scratch = Path(os.environ['RUNNER_TEMP']) / 'overnight-scratch' / 'termination-probe'
          receipt = json.loads((scratch / 'receipt.json').read_text())
          run_id = receipt['research']['run_id']
          assert receipt['state'] == 'queued'
          assert (scratch / 'research' / 'ledger.sqlite3').is_file()
          assert (scratch / 'research' / run_id / 'snapshot.json.gz').is_file()
          out = Path(os.environ['RUNNER_TEMP']) / 'overnight-evidence'
          (out / 'outer-kill-retention.json').write_text(json.dumps({'passed': True, 'exit_code': 137,
              'research_run_id': run_id, 'retained': ['receipt.json', 'research/ledger.sqlite3', 'snapshot.json.gz']}))
          with (out / 'report.md').open('a') as report:
              report.write('\nOuter-container SIGKILL: PASS. Queued receipt, ledger and snapshot survived on bounded host scratch.\n')
          PY
          cleanup
          ! docker container inspect tj-overnight-fixture-run >/dev/null 2>&1
          ! docker container inspect tj-overnight-retention-probe >/dev/null 2>&1
          printf '{"containers_removed":true}\n' > "$RUNNER_TEMP/overnight-evidence/cleanup.json"
      - name: Preserve scratch even if evaluator cannot finalize
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/overnight-evidence"
          if [ -d "$RUNNER_TEMP/overnight-scratch" ]; then
            tar -czf "$RUNNER_TEMP/overnight-evidence/scratch-after-run.tar.gz" -C "$RUNNER_TEMP/overnight-scratch" .
          fi
      - name: Publish report in run summary
        if: always()
        env:
          TRIAL_OUTCOME: ${{ steps.trial.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'overnight-evidence'
          outcome = os.environ['TRIAL_OUTCOME']
          (out / 'workflow-outcome.json').write_text(json.dumps({'trial_step': outcome}))
          path = out / 'report.md'
          if outcome != 'success':
              prior = path.read_text() if path.exists() else 'No evaluator report was produced.\n'
              path.write_text('# Overall supervised trial: FAILED / INCOMPLETE\n\nInspect workflow logs and retained scratch.\n\n' + prior)
          PY
          if [ -f "$RUNNER_TEMP/overnight-evidence/report.md" ]; then
            cat "$RUNNER_TEMP/overnight-evidence/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Trial did not produce a report. Inspect the failed step; no success is claimed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervised-overnight-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/overnight-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable host scratch mount
        if: always()
        run: |
          if mountpoint -q "$RUNNER_TEMP/overnight-scratch"; then
            sudo umount "$RUNNER_TEMP/overnight-scratch"
          fi
