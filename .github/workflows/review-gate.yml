name: Independent review gate

on:
  # Only trusted base code runs, even when a contributor changes this workflow.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  status:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: independent-review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'status' || github.event.context == 'tradejournal/review-receipt'
    name: Update review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # An explicitly dispatched feature ref permits testing this workflow
          # before adoption. PR/status/schedule events always use trusted main.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./scripts/review_gate.cjs');
            await gate({github, context, core});
