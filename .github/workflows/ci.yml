name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a maintainer or an agent re-run CI without pushing an empty commit.
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Documentation and contributor-guide edits cannot affect the built app.
  # Keep the cheap backend gate for docs links/freshness, but avoid starting
  # two disposable application environments for a non-runtime diff. Pushes to
  # main and manual runs always retain the entire release gate.
  changes:
    name: Changed runtime scope
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      # The pull-request merge commit and its base parent are all the scope
      # check reads; pushes and manual runs need no checkout at all.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Classify pull-request scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            printf '%s\n' runtime=true frontend=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/ci_scope.sh | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # test_docs_freshness.py counts commits since documentation was last
          # reconciled. The default shallow fetch has no history to count, and
          # the check would skip itself silently rather than fail.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Matches requires-python >=3.10 while staying on a version the
          # scientific dependencies (scipy, yfinance) ship wheels for.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # pyflakes and pycodestyle errors only: unused imports and variables,
      # undefined names, import placement. The rule set and the exact ruff
      # version live in pyproject.toml, so this run matches verify.sh locally.
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff check --config pyproject.toml ../deploy

      # The static import graph: what the public ingress may reach, that the
      # private app never imports the ingress side, and which engine modules
      # stay free of network and database imports. Run first and on its own so
      # a boundary violation reads as one named failure; the full suite below
      # runs it again, which costs a tenth of a second.
      - name: Import boundaries
        working-directory: backend
        run: pytest tests/test_import_boundaries.py -q

      # No credentials and no DATABASE_URL: tests/conftest.py pins the suite to
      # a throwaway SQLite database, and every external integration is opt-in.
      # test_schema_migrations.py covers `alembic upgrade head` and the
      # models-vs-migrations drift check, so no separate migration step is
      # needed here.
      #
      # On a push to main the docs-freshness tripwire is left out: a green CI
      # run on main is what publishes a release, and overdue documentation must
      # not hold a working fix off the server. Pull requests still run it.
      - name: Tests
        working-directory: backend
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            pytest -q --deselect tests/test_docs_freshness.py::test_the_drift_pass_is_not_overdue
          else
            pytest -q
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Warnings are allowed on purpose; see frontend/eslint.config.mjs.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Catches server-component and route errors that typecheck alone misses.
      # next/font fetches Google Fonts at build time, which needs network.
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser shard (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/2"
            artifact: one
          - shard: "2/2"
            artifact: two
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The browser tests boot the real backend against a seeded SQLite
      # database, so both toolchains are needed in this job.
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Reuse Playwright's Chromium download across runs. The lockfile fixes
      # the Playwright version and therefore the matching browser revision.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Playwright seeds the database, starts the backend and a fresh frontend
      # build on 8099/3099, and asserts real values reach the DOM. This is the
      # only check that proves a page renders; typecheck, lint and build all
      # pass on a component that is broken at runtime.
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run e2e -- --shard=${{ matrix.shard }}

      - name: Authenticated browser boundaries
        if: matrix.shard == '1/2'
        working-directory: frontend
        run: npx playwright test --config playwright.auth.config.ts

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: |
            frontend/test-results/
            frontend/auth-test-results/
          retention-days: 7

      # A pull request's pictures, for the Screenshots job to post. It never
      # fails this job.
      - name: Upload screenshots
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.artifact }}
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  # Keep one stable required-check name even though the expensive work is
  # divided across runners. Docs-only changes complete this no-op gate; a
  # failed classifier, failed shard or cancelled shard fails it closed.
  browser:
    name: Browser
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          SHARDS_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$RUNTIME_CHANGED" != true ]; then
            echo "Documentation-only pull request; browser shards are not needed."
            exit 0
          fi
          test "$SHARDS_RESULT" = success

  screenshots:
    name: Screenshots
    needs: [changes, e2e]
    # Same-repository pull requests only: a fork's token cannot write the
    # comment, and nothing here should hold write access over a fork's code.
    # Report-only, and absent from pushes to main, so it never gates a release.
    # Pictures are only worth a look when the pull request changes what the
    # app shows, so backend-only pull requests get no comment.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the ci-screenshots branch that hosts the comment's images
      pull-requests: write # the comment itself
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      E2E_RESULT: ${{ needs.e2e.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STORE_BRANCH: ci-screenshots
      # Unique per run, so GitHub's image cache never shows an older picture.
      STORE_DIR: pr/${{ github.event.pull_request.number }}/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        if: needs.e2e.result == 'success'

      - name: Download this run's screenshots
        if: needs.e2e.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: ${{ runner.temp }}/pictures
          merge-multiple: true

      # A failure here leaves no comment.md, and the next step says so on the
      # pull request instead of failing it.
      - name: Build the comment
        if: needs.e2e.result == 'success'
        continue-on-error: true
        run: |
          node frontend/scripts/screenshot-gallery.mjs \
            --pictures "$RUNNER_TEMP/pictures" \
            --out "$RUNNER_TEMP/screenshot-report" \
            --image-url "https://raw.githubusercontent.com/$REPO/$STORE_BRANCH/$STORE_DIR" \
            --label "${HEAD_SHA:0:7}" \
            --run-url "$RUN_URL"

      # Images live on an orphan branch that is never merged and holds one
      # commit, replaced on every update, so it cannot grow a history. Each
      # pull request's folder is replaced by its newest run and removed once
      # the pull request is closed.
      - name: Publish images and comment
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/screenshot-report"
          BODY="$RUNNER_TEMP/comment.md"
          if [ -f "$REPORT/comment.md" ]; then
            cp "$REPORT/comment.md" "$BODY"
          elif [ "$E2E_RESULT" = "failure" ]; then
            printf '%s\n' "<!-- ci-screenshots -->" "### Screenshots" "" \
              "Browser tests failed on ${HEAD_SHA:0:7}, so there are no pictures to show. Failure pictures are in the run's \`playwright-report-one\` and \`playwright-report-two\` downloads, one per browser shard: [test run]($RUN_URL)." \
              > "$BODY"
          else
            printf '%s\n' "<!-- ci-screenshots -->" "### Screenshots" "" \
              "Could not post the pictures for ${HEAD_SHA:0:7}. See the Screenshots job: [test run]($RUN_URL)." \
              > "$BODY"
          fi

          gh auth setup-git
          STORE="$RUNNER_TEMP/store"
          for attempt in 1 2 3 4 5; do
            rm -rf "$STORE" && git init -q "$STORE"
            git -C "$STORE" remote add origin "https://github.com/$REPO.git"
            TIP=$(git -C "$STORE" ls-remote origin "refs/heads/$STORE_BRANCH" | cut -f1)
            if [ -n "$TIP" ]; then
              git -C "$STORE" fetch -q --depth 1 origin "$TIP"
              git -C "$STORE" checkout -q FETCH_HEAD
            fi
            rm -rf "$STORE/pr/$PR"
            if [ -d "$REPORT/images" ] && [ -n "$(ls -A "$REPORT/images")" ]; then
              mkdir -p "$STORE/$STORE_DIR"
              cp "$REPORT/images/"*.png "$STORE/$STORE_DIR/"
            fi
            for dir in "$STORE"/pr/*/; do
              [ -d "$dir" ] || continue
              state=$(gh pr view "$(basename "$dir")" -R "$REPO" --json state --jq .state 2>/dev/null || echo UNKNOWN)
              if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
                rm -rf "$dir"
              fi
            done
            git -C "$STORE" add -A
            [ -n "$TIP" ] || [ -n "$(git -C "$STORE" ls-files)" ] || break
            TREE=$(git -C "$STORE" write-tree)
            if [ -n "$TIP" ] && [ "$TREE" = "$(git -C "$STORE" rev-parse 'HEAD^{tree}')" ]; then
              break
            fi
            COMMIT=$(git -C "$STORE" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$TREE" -m "Screenshots for pull request #$PR")
            # The lease refuses the push if another run moved the branch since
            # it was read; start over from the new tip rather than drop its work.
            if git -C "$STORE" push -q --force-with-lease="refs/heads/$STORE_BRANCH:$TIP" \
                origin "$COMMIT:refs/heads/$STORE_BRANCH"; then
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "Could not update $STORE_BRANCH after 5 attempts."; exit 1; }
            sleep $((attempt * 3))
          done

          # GitHub's image proxy can fetch a just-pushed file before the raw
          # host serves it; wait for one so the comment never opens broken.
          FIRST=$(ls "$REPORT/images" 2>/dev/null | head -n 1 || true)
          if [ -n "$FIRST" ]; then
            for _ in $(seq 1 12); do
              curl -sfo /dev/null "https://raw.githubusercontent.com/$REPO/$STORE_BRANCH/$STORE_DIR/$FIRST" && break
              sleep 5
            done
          fi

          # One comment per pull request, edited in place on every run.
          IDS=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ci-screenshots -->"))) | .id')
          ID=${IDS%%$'\n'*}
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$BODY" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$BODY" > /dev/null
          fi

  postgres:
    name: Postgres parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tj
          POSTGRES_PASSWORD: tj
          POSTGRES_DB: tj_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The rest of the suite runs on SQLite, but production is Neon. This
      # job covers what only Postgres can prove: the full Alembic chain (some
      # revisions use SQLite's batch table recreation), ExactDecimal's
      # NUMERIC path, and constraint enforcement.
      #
      # An ephemeral service container, not a Neon branch: no secret is
      # needed, and dialect problems do not require Neon-specific behavior to
      # reproduce.
      #
      # TEST_DATABASE_URL is deliberately not DATABASE_URL -- conftest.py pins
      # DATABASE_URL to throwaway SQLite so the suite can never inherit a
      # hosted database, and that guard stays intact.
      - name: Dialect parity tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tj:tj@127.0.0.1:5432/tj_parity
        run: pytest tests/test_postgres_parity.py -q

      # The parity job above migrates an *empty* database. Real databases have
      # history: the Neon dev branch was found stamped part-way with later
      # tables already present, because startup used to call create_all().
      # These build that state and the neighbouring ones and assert what the
      # migration chain and the preflight do with each -- no secret and no Neon
      # branch needed, since none of it depends on Neon-specific behavior.
      - name: Migration path tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tj:tj@127.0.0.1:5432/tj_parity
        run: pytest tests/test_postgres_migration_paths.py -q

      # Roles are a server feature with no SQLite equivalent, so the only place
      # setup_roles.py can be proven is here: it creates real roles and then
      # connects as each one to check what it is actually refused. Uses
      # throwaway role names -- roles are cluster-wide, and a test that created
      # tj_app would collide with a real one on a developer's machine.
      - name: Database role tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tj:tj@127.0.0.1:5432/tj_parity
        run: pytest tests/test_setup_roles.py -q
